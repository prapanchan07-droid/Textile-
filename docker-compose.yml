services:
  backend:
    build:
      context: ./backend
    container_name: ai-factory-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - factory_data:/app/data
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-factory-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  factory_data: